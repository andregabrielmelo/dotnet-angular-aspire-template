name: End-to-end

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/e2e.yml'
  pull_request: # no paths filter: the gate job below must report on every PR (see README)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.filter.outputs.run }}

    steps:
      - name: Check changed files
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT" # push (already path-filtered) or manual dispatch
            exit 0
          fi
          # Assign first so an API error fails the job instead of reading as "nothing changed".
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
          if grep -Eq '^(backend/|frontend/|\.github/workflows/e2e\.yml$)' <<< "$files"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No backend or frontend changes in this PR - skipping the end-to-end tests."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: Browser flows (Aspire + Playwright)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    # The whole AppHost runs here: Postgres, Redis, Keycloak and Mailpit containers, the API,
    # the backend for frontend and the Angular dev server. Linux only - it needs Docker.
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # The AppHost runs `npm ci` and `npm start` for the Angular app itself.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The API and the backend for frontend serve HTTPS with the ASP.NET Core development
      # certificate, and the backend for frontend calls the API over it, so it must be trusted.
      - name: Create and trust the development certificate
        run: |
          dotnet dev-certs https --trust
          echo "SSL_CERT_DIR=$HOME/.aspnet/dev-certs/trust:/usr/lib/ssl/certs" >> "$GITHUB_ENV"

      - name: Build
        working-directory: backend
        run: dotnet build tests/AppTemplate.EndToEndTests --configuration Release

      - name: Install Playwright's Chromium
        working-directory: backend
        run: pwsh tests/AppTemplate.EndToEndTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Test
        working-directory: backend
        run: >-
          dotnet test tests/AppTemplate.EndToEndTests --configuration Release --no-build
          --logger "console;verbosity=normal"

      # Open a trace with `npx playwright show-trace <file>.zip`, or at trace.playwright.dev.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: backend/tests/AppTemplate.EndToEndTests/bin/Release/net10.0/playwright-traces/
          if-no-files-found: ignore
          retention-days: 7

  # Always reports, so it can be required: a skipped job reports nothing (see README).
  gate:
    name: End-to-end CI
    needs: [changes, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check end-to-end result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          echo "changes: $CHANGES_RESULT, e2e: $E2E_RESULT"
          [ "$CHANGES_RESULT" = "success" ] || exit 1
          case "$E2E_RESULT" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
