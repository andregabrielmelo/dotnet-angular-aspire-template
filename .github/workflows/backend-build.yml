name: Backend Build

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/backend-build.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }} # superseded PR runs are cancelled; every main/develop run finishes

jobs:
  build:
    name: Build (.NET 10, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25 # the Linux job also pulls Postgres for Testcontainers


    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false # get the full picture across OSes instead of stopping at the first failure

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: backend/**/packages.lock.json

      - name: Restore dependencies
        working-directory: backend
        run: dotnet restore AppTemplate.slnx --locked-mode

      - name: Check formatting (csharpier)
        working-directory: backend
        run: |
          dotnet tool restore
          dotnet csharpier check .

      - name: Build
        working-directory: backend
        run: dotnet build AppTemplate.slnx --configuration Release --no-restore

      # Functional tests run against a real Postgres via Testcontainers, which needs a Docker
      # daemon that runs Linux containers - only the Linux runners have one. Windows and macOS
      # run everything else (unit tests, and functional tests that don't touch the database).
      - name: Test
        if: runner.os == 'Linux'
        working-directory: backend
        run: dotnet test AppTemplate.slnx --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Test (without Docker)
        if: runner.os != 'Linux'
        working-directory: backend
        run: dotnet test AppTemplate.slnx --configuration Release --no-build --filter "Category!=RequiresDocker" --logger "console;verbosity=normal"
