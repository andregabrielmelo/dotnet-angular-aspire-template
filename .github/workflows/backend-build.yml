name: Backend Build

on:
  push:
    branches:
      - '**'
    paths:
      - 'backend/**'
      - '.github/workflows/backend-build.yml'
  pull_request:
    branches:
      - '**'
    paths:
      - 'backend/**'
      - '.github/workflows/backend-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build (.NET 10, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false # get the full picture across OSes instead of stopping at the first failure

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        working-directory: backend
        run: dotnet restore AppTemplate.slnx

      - name: Check formatting (csharpier)
        working-directory: backend
        run: |
          dotnet tool restore
          dotnet csharpier check .

      - name: Build
        working-directory: backend
        run: dotnet build AppTemplate.slnx --configuration Release --no-restore

      - name: Test
        working-directory: backend
        run: dotnet test AppTemplate.slnx --configuration Release --no-build --logger "console;verbosity=normal"
