name: CodeQL Analysis

# Security scanning on a schedule rather than every push - it's slow and isn't meant to
# gate PRs, just catch new vulnerabilities as CodeQL's query set evolves.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 1 * *' # Monthly at 8 AM UTC

jobs:
  analyze:
    name: CodeQL Analysis (${{ matrix.language }})
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - name: Build backend
        if: matrix.language == 'csharp'
        working-directory: backend
        run: |
          dotnet restore AppTemplate.slnx
          dotnet build AppTemplate.slnx --configuration Release --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
