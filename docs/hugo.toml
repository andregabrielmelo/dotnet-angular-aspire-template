baseURL = 'https://andregabrielmelo.github.io/dotnet-angular-aspire-template/'
languageCode = 'en-us'
title = 'AppTemplate Docs'
theme = 'hugo-book' # A popular, clean, and minimal docs theme

[params]
  BookRepo = 'https://github.com/andregabrielmelo/dotnet-angular-aspire-template'
  BookEditPath = 'edit/main/docs'
  BookSection = '*'
  # Default for first-time visitors / no-JS; the toggle in the sidebar (see
  # layouts/_partials/docs/inject/{head,menu-before}.html) overrides this
  # per-visitor via localStorage.
  BookTheme = 'dark'
