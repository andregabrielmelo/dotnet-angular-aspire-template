<button
  id="theme-toggle"
  type="button"
  aria-label="Toggle light/dark theme"
  style="display:flex;align-items:center;gap:0.4rem;width:100%;margin:0 0 0.75rem;padding:0.4rem 0.6rem;border:1px solid var(--gray-200);border-radius:0.25rem;background:transparent;color:inherit;cursor:pointer;font:inherit;font-size:0.9rem;"
>
  <span id="theme-toggle-label"></span>
</button>
<script>
  (function () {
    var html = document.documentElement;
    var button = document.getElementById('theme-toggle');
    var label = document.getElementById('theme-toggle-label');

    function currentTheme() {
      return html.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    }

    function render() {
      label.textContent = currentTheme() === 'dark' ? '☀️ Switch to light' : '🌙 Switch to dark';
    }

    button.addEventListener('click', function () {
      var next = currentTheme() === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      try {
        localStorage.setItem('theme', next);
      } catch (e) {}
      render();
    });

    render();
  })();
</script>
