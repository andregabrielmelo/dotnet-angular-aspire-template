<section class="mb-6" aria-labelledby="avatar-heading">
  <h2 id="avatar-heading" class="mb-2 text-sm font-medium">Avatar</h2>
  <div class="flex items-center gap-4">
    @if (imageUrl(); as url) {
      <img [src]="url" alt="Your avatar" class="h-16 w-16 rounded-full object-cover" />
    } @else {
      <div class="h-16 w-16 rounded-full bg-gray-200" role="img" aria-label="No avatar yet"></div>
    }
    <div class="flex flex-col gap-2">
      <label class="cursor-pointer text-sm text-blue-600 underline">
        {{ imageUrl() ? 'Replace image' : 'Upload image' }}
        <input
          type="file"
          class="sr-only"
          [accept]="accept"
          [disabled]="busy()"
          (change)="upload($event)"
        />
      </label>
      @if (imageUrl()) {
        <button
          type="button"
          class="text-left text-sm text-red-700 underline disabled:opacity-50"
          [disabled]="busy()"
          (click)="remove()"
        >
          Remove image
        </button>
      }
    </div>
  </div>
  <p class="mt-1 text-xs text-gray-500">JPEG, PNG or WebP, up to 2 MB.</p>
  @if (errorMessage(); as message) {
    <p class="mt-2 text-sm text-red-600" role="alert">{{ message }}</p>
  }
</section>
