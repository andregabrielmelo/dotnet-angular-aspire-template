<div class="mx-auto max-w-sm p-6">
  <h1 class="mb-6 text-2xl font-semibold">Forgot your password?</h1>

  @if (submitted()) {
    <p class="rounded-md bg-blue-50 p-3 text-sm text-blue-700">
      If that email is registered, we've sent a link to reset your password.
    </p>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2 text-sm"
        />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <p class="mt-1 text-sm text-red-600">Enter a valid email address.</p>
        }
      </div>

      <button
        type="submit"
        [disabled]="submitting()"
        class="w-full rounded-md bg-blue-600 px-4 py-2 text-sm font-medium text-white disabled:opacity-50"
      >
        {{ submitting() ? 'Sending…' : 'Send reset link' }}
      </button>
    </form>
  }

  <p class="mt-4 text-sm text-gray-600">
    <a routerLink="/auth/login" class="text-blue-600 underline">Back to log in</a>
  </p>
</div>
