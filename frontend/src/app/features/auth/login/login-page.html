<div class="mx-auto max-w-sm p-6">
  <h1 class="mb-6 text-2xl font-semibold">Log in</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
    <div>
      <label for="email" class="block text-sm font-medium">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2 text-sm"
      />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <p class="mt-1 text-sm text-red-600">Enter a valid email address.</p>
      }
    </div>

    <div>
      <label for="password" class="block text-sm font-medium">Password</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2 text-sm"
      />
    </div>

    @if (errorMessage(); as message) {
      <p class="text-sm text-red-600">{{ message }}</p>
    }

    <button
      type="submit"
      [disabled]="submitting()"
      class="w-full rounded-md bg-blue-600 px-4 py-2 text-sm font-medium text-white disabled:opacity-50"
    >
      {{ submitting() ? 'Logging in…' : 'Log in' }}
    </button>
  </form>

  <p class="mt-4 text-sm text-gray-600">
    Don't have an account? <a routerLink="/register" class="text-blue-600 underline">Register</a>
  </p>
</div>
