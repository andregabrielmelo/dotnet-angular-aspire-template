# Single-node Garage for local development (and the functional tests, which mount this same
# file). Secrets come from the environment: GARAGE_RPC_SECRET, and the default key and bucket
# from GARAGE_DEFAULT_ACCESS_KEY / GARAGE_DEFAULT_SECRET_KEY / GARAGE_DEFAULT_BUCKET, which
# `garage server --single-node --default-bucket` creates on first start.
#
# Every option of Garage v2.4.1 (GarageDefaults.Tag) is listed here, checked against that
# version's src/util/config.rs (the online reference describes newer versions):
# - Uncommented options are in effect. Defaults are written out on purpose, marked
#   "(default)", so an upgrade that changes a default can't change our setup unnoticed.
# - Commented-out options are unused: each shows its default and when you'd set it.
# - Garage silently ignores unknown keys, so a typo here looks valid. After bumping the tag,
#   re-check this file against the new version's options and defaults.
# - The legacy `replication_mode` option is gone; setting it is a startup error.
# Reference: https://garagehq.deuxfleurs.fr/documentation/reference-manual/configuration/

# --- Replication and consistency --------------------------------------------------------

# Copies of each piece of data; must be <= the number of nodes. 1 means no redundancy, which
# is fine for disposable dev data. Production: 3, with nodes in 3 zones. Required, no default.
replication_factor = 1

# Read/write quorums: "consistent" (read-after-write), "degraded" (reads from 1 node, may be
# stale) or "dangerous" (reads and writes on 1 node; can lose data). Meaningless with 1 node.
consistency_mode = "consistent" # (default)

# --- Storage locations and durability ---------------------------------------------------

# Node identity, cluster layout, buckets, keys and the object index. Put it on an SSD.
metadata_dir = "/var/lib/garage/meta"

# Object contents, as blocks. Can be HDDs.
data_dir = "/var/lib/garage/data"
# For several disks, use a list instead; capacity is per disk, read_only drains one:
# data_dir = [
#     { path = "/mnt/disk1/garage", capacity = "2T" },
#     { path = "/mnt/disk2/garage", read_only = true },
# ]

# true syncs metadata to disk on every write. With SQLite, false means PRAGMA synchronous=OFF:
# safe if Garage crashes, but a power loss or VM (WSL) crash can corrupt the metadata. Set true
# on a single node holding data you care about; replicas make it unnecessary.
metadata_fsync = false # (default)

# true fsyncs data blocks too. Same trade-off as above, at a smaller write cost.
data_fsync = false # (default)

# Monthly background read of every block, repairing corrupted ones from other nodes. Disable
# only when the filesystem scrubs itself (ZFS, Btrfs).
disable_scrub = false # (default)

# Lifecycle rules (e.g. object expiry) run at midnight UTC; true uses the node's local
# midnight. Must be the same on every node.
use_local_tz = false # (default)

# Where metadata snapshots go; default (unset): <metadata_dir>/snapshots. Snapshots can take
# up to 4x the metadata size, so point this at a bigger disk when you enable them.
# metadata_snapshots_dir = "/var/lib/garage/snapshots"

# Automatic metadata snapshots, keeping the latest two. Default (unset): off. Set it with LMDB,
# the documented way to recover from LMDB corruption.
# metadata_auto_snapshot_interval = "6h"

# --- Metadata engine --------------------------------------------------------------------

# "lmdb" (Garage's default; fastest, recommended with replication_factor >= 2, but can corrupt
# on unclean shutdown and isn't portable between CPU architectures), "sqlite" (slower, fine for
# small loads) or "fjall" (experimental). Switch an existing node with `garage convert-db`.
db_engine = "sqlite"

# LMDB only: maximum database size (virtual address space, not RAM). Default (unset): 1 TiB on
# 64-bit, 1 GiB on 32-bit. Raise it when the metadata of a big LMDB node approaches it.
# lmdb_map_size = "1T"

# Fjall only: block cache size. Default (unset): Fjall's own default.
# fjall_block_cache_size = "64MiB"

# --- Blocks and performance -------------------------------------------------------------

# Objects are split into blocks of this size (bytes); it's also the deduplication unit.
# ~10 MiB suits large files on fast networks. Only affects new uploads.
block_size = 1048576 # 1 MiB (default)

# RAM for blocks waiting to be written to other nodes (bytes); clients are slowed down when
# it's full. Raise it on nodes with plenty of RAM and bursty uploads.
block_ram_buffer_max = 268435456 # 256 MiB (default)

# Block files open for reading at once; requests wait up to 15 s for a slot. Lower it for
# slow HDDs that time out (metric block_read_semaphore_timeouts).
block_max_concurrent_reads = 16 # (default)

# Blocks one upload writes in parallel. Suggested: 10-30 on NVMe, 3-10 on HDDs.
block_max_concurrent_writes_per_request = 3 # (default)

# zstd level for stored blocks: 1-19, 20-22 (memory hungry), 0 (zstd's default, 3),
# negative (faster) or "none". Higher levels add latency to every write.
compression_level = 1 # (default)

# --- RPC and cluster --------------------------------------------------------------------

# Shared 32-byte hex secret identifying the cluster's nodes (`openssl rand -hex 32`). Never
# put it here: it comes from GARAGE_RPC_SECRET (an AppHost parameter). A file works too.
# rpc_secret = "<64 hex characters>"
# rpc_secret_file = "/run/secrets/garage-rpc-secret"

# Port other nodes connect to. Required.
rpc_bind_addr = "[::]:3901"

# Address other nodes should use to reach this one. Unset: Garage guesses from the network
# interfaces (see rpc_public_addr_subnet). Set here so the single node knows its own address.
rpc_public_addr = "127.0.0.1:3901"

# Restricts that guess to one subnet, when rpc_public_addr is unset. Default (unset): any
# non-loopback interface.
# rpc_public_addr_subnet = "10.0.0.0/24"

# true makes outgoing connections use the listening IP. Needed on multi-IP hosts where only
# one address can reach the other nodes.
rpc_bind_outgoing = false # (default)

# How long to wait for a peer's ping reply, and for an RPC call. Default (unset): 10000 and
# 300000 ms. Raise them for nodes on slow or distant links.
# rpc_ping_timeout_msec = 10000
# rpc_timeout_msec = 300000

# Nodes to contact on startup, as "<node public key>@<address>:<port>" (`garage node id`
# prints it). The rest of the cluster is discovered from them. A single node has none.
bootstrap_peers = [] # (default)

# true skips the check that secret files (rpc_secret_file etc.) aren't readable by every user.
# Only for false positives, such as files protected by POSIX ACLs.
allow_world_readable_secrets = false # (default)

# true allows punycode bucket names, for websites on non-ASCII domains.
allow_punycode = false # (default)

# --- Discovery (instead of listing bootstrap_peers) -------------------------------------

# Nodes register in Consul and find each other there; requires rpc_public_addr.
# [consul_discovery]
# api = "catalog"                    # (default) or "agent"; catalog supports mTLS, agent a token
# consul_http_addr = "https://127.0.0.1:8500"
# service_name = "garage-daemon"
# ca_cert = "/etc/consul/consul-ca.crt"
# client_cert = "/etc/consul/consul-client.crt"   # catalog API only
# client_key = "/etc/consul/consul-key.crt"       # catalog API only
# token = "<consul token>"                        # agent API only
# tls_skip_verify = false            # (default)
# tags = []                          # (default)
# meta = { dns-acl = "allow trusted" }            # default (unset): none
# datacenters = []                   # (default); list them for WAN federation

# Nodes register as garagenodes.deuxfleurs.fr custom resources in Kubernetes.
# [kubernetes_discovery]
# namespace = "garage"
# service_name = "garage-daemon"
# skip_crd = false                   # (default); true if you install the CRD yourself

# --- S3 API (what the Web API talks to) -------------------------------------------------

[s3_api]
# Plain HTTP only: put a TLS reverse proxy in front in production. Can be a unix socket path.
api_bind_addr = "[::]:3900"

# Region clients must sign requests with; must match GarageDefaults.Region. Required.
s3_region = "garage"

# Enables virtual-host-style URLs (bucket.s3.example.com); needs wildcard DNS and probably a
# wildcard certificate. Default (unset): path-style only, which is what we use.
# root_domain = ".s3.example.com"

# Requires a newer Garage than v2.4.1; ignored by this version. The public URL and URL style
# Garage tells clients about.
# advertise_endpoint = "https://s3.example.com"
# advertise_path_style = true

# --- K2V API (experimental key-value API) -----------------------------------------------

# Only for apps that use Garage's own K2V API instead of S3.
# [k2v_api]
# api_bind_addr = "[::]:3904"

# --- Static website hosting -------------------------------------------------------------

# Serves buckets as websites: bucket "mysite" answers on mysite.web.example.com.
# [s3_web]
# bind_addr = "[::]:3902"
# root_domain = ".web.example.com"
# add_host_to_metrics = false        # (default); true risks a metric per hostname

# --- Admin API, metrics and tracing -----------------------------------------------------

# Deliberately off (ADR 018): no admin port and no admin token to leak. --single-node
# --default-bucket does the one admin job we need. Enable it for metrics, tracing or
# managing keys and buckets over HTTP.
# [admin]
# api_bind_addr = "[::]:3903"
# admin_token = "<openssl rand -base64 32>"       # full rights, never expires; or GARAGE_ADMIN_TOKEN
# admin_token_file = "/run/secrets/garage-admin-token"
# metrics_token = "<openssl rand -base64 32>"     # or GARAGE_METRICS_TOKEN
# metrics_token_file = "/run/secrets/garage-metrics-token"
# metrics_require_token = false      # (default); unset token + false = open /metrics
# trace_sink = "http://localhost:4317"            # OpenTelemetry collector for request traces
